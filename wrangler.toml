# TradeQuest on Cloudflare Workers + D1. Setup guide: docs/CLOUDFLARE.md
name = "tradequest"
main = "worker/index.js"
compatibility_date = "2026-11-01"
workers_dev = true      # https://tradequest.<subdomain>.workers.dev
preview_urls = false    # no extra per-version URLs

# The web app (public/) is served as static assets; only /api/* runs the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Your journal (D1 database "tradequest").
[[d1_databases]]
binding = "DB"
database_name = "tradequest"
database_id = "7fd5790d-8c45-4ecb-8764-a76033bc6bc0"

# Secrets — set with `npx wrangler secret put <NAME>`, never in this file:
#   APP_PASSWORD      the password for logging in to TradeQuest (8+ characters)
#   KITE_API_KEY      from developers.kite.trade (optional)
#   KITE_API_SECRET   from developers.kite.trade (optional)

# Paper trading: run the order engine every minute on weekdays, 08:30–00:29 IST (03:00–18:59 UTC),
# so pending paper orders, stops and MIS square-offs happen even with no page open.
[triggers]
crons = ["* 3-18 * * 1-5"]
