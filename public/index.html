<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <title>TradeQuest — Trading Journal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function () {
      var t; try { t = localStorage.getItem('tq-theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard"><span class="brand-mark">⚔️</span><span>Trade<b>Quest</b></span></a>
      <nav class="nav">
        <a href="#/dashboard" data-route="dashboard"><span>🏠</span><b>Dashboard</b><i>Home</i></a>
        <a href="#/journal" data-route="journal"><span>📒</span><b>Journal</b><i>Journal</i></a>
        <a href="#/insights" data-route="insights"><span>📊</span><b>Insights</b><i>Insights</i></a>
        <a href="#/review" data-route="review"><span>🪞</span><b>Weekly review</b><i>Review</i></a>
        <a href="#/size" data-route="size" class="desk-only"><span>🧮</span><b>Position size</b><i>Size</i></a>
        <a href="#/practice" data-route="practice"><span>🎮</span><b>Practice</b><i>Practice</i></a>
        <a href="#/achievements" data-route="achievements"><span>🏆</span><b>Achievements</b><i>Badges</i></a>
        <a href="#/settings" data-route="settings"><span>⚙️</span><b>Settings</b><i>Settings</i></a>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main id="main" class="main"><div class="loading">Loading your journal…</div></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toasts" class="toasts"></div>
  <canvas id="confetti" class="confetti"></canvas>
  <script type="module" src="/js/main.js"></script>
  <a href="#/size" id="fab-size" class="fab" title="Position size calculator" aria-label="Position size calculator">🧮</a>
</body>
</html>
