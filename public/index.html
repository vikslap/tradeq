<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TradeQuest — Trading Journal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/dashboard"><span class="brand-mark">⚔️</span><span>Trade<b>Quest</b></span></a>
      <nav class="nav">
        <a href="#/dashboard" data-route="dashboard"><span>🏠</span>Dashboard</a>
        <a href="#/journal" data-route="journal"><span>📒</span>Journal</a>
        <a href="#/insights" data-route="insights"><span>📊</span>Insights</a>
        <a href="#/review" data-route="review"><span>🪞</span>Weekly review</a>
        <a href="#/achievements" data-route="achievements"><span>🏆</span>Achievements</a>
        <a href="#/settings" data-route="settings"><span>⚙️</span>Settings</a>
      </nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <div class="main-col">
      <header class="topbar" id="topbar"></header>
      <main id="main" class="main"><div class="loading">Loading your journal…</div></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toasts" class="toasts"></div>
  <canvas id="confetti" class="confetti"></canvas>
  <script type="module" src="/app.js"></script>
</body>
</html>
